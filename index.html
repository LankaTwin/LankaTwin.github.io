    <script>
      // Old links used the hash (#/station/kandy): move them to the real path before anything renders.
      if (location.hash.indexOf('#/') === 0) history.replaceState(null, '', location.hash.slice(1))
      try { var t = localStorage.getItem('lt-theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark') } catch (e) {}
      // Widgets embedded on other sites skip the splash.
      if (location.pathname.indexOf('/embed/') === 0) document.documentElement.classList.add('lt-embed')
    </script>
    <style>
      /* Splash while the app loads; removed by src/main.tsx, or after 10 s whatever happens. */
      #lt-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #F2F5F4; color: #12262E; font-family: 'Schibsted Grotesk', system-ui, sans-serif; transition: opacity .35s ease, visibility .35s; }
      .dark #lt-splash { background: #0B1F24; color: #E6EEEC; }
      .lt-embed #lt-splash, #lt-splash.lt-done { opacity: 0; visibility: hidden; }
      #lt-splash .lt-sp { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #lt-splash .lt-sp-mark { position: relative; width: 96px; height: 96px; }
      #lt-splash .lt-sp-mark svg { width: 96px; height: 96px; display: block; border-radius: 22px; box-shadow: 0 10px 30px rgba(10, 79, 87, .28); }
      #lt-splash .lt-sp-mark::after { content: ''; position: absolute; inset: -10px; border-radius: 30px; border: 3px solid #14919A; opacity: 0; animation: lt-sp-ring 1.8s ease-out infinite; }
      #lt-splash .lt-sp-name { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
      #lt-splash .lt-sp-name b { color: #14919A; }
      #lt-splash .lt-sp-full { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-wrap: balance; max-width: 360px; text-transform: uppercase; color: #14919A; margin-top: -12px; text-align: center; padding: 0 24px; }
      #lt-splash .lt-sp-tag { font-size: 14px; opacity: .7; margin-top: -10px; text-align: center; padding: 0 24px; }
      #lt-splash .lt-sp-bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(14, 110, 120, .15); overflow: hidden; }
      #lt-splash .lt-sp-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #14919A; animation: lt-sp-bar 1.2s ease-in-out infinite; }
      @keyframes lt-sp-ring { 0% { opacity: .6; transform: scale(.92); } 100% { opacity: 0; transform: scale(1.18); } }
      @keyframes lt-sp-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #lt-splash .lt-sp-mark::after, #lt-splash .lt-sp-bar i { animation: none; } }
      /* The pre-rendered page under the splash: readable without JavaScript. */
      .lt-static { max-width: 760px; margin: 0 auto; padding: 24px 16px; font-family: system-ui, sans-serif; line-height: 1.5; color: #12262E; }
      .lt-static a { color: #0E6E78; }
      .lt-static ul { columns: 2; padding-left: 18px; }
      .lt-static nav ol { list-style: none; padding: 0; display: flex; gap: 8px; flex-wrap: wrap; font-size: 14px; }
      .lt-static nav li + li::before { content: '›'; margin-right: 8px; color: #5b6f74; }
      .lt-static-brand { font-weight: 800; font-size: 20px; text-decoration: none; }
    </style>
    <noscript><style>#lt-splash { display: none; }</style></noscript>

    <div id="lt-splash" role="status" aria-live="polite" aria-label="Loading LankaTwin, the Lankan Technical Weather Information Network">

        <div class="lt-sp-name">Lanka<b>Twin</b></div>
        <div class="lt-sp-full">Lankan Technical Weather Information Network</div>
        <div class="lt-sp-tag">Live weather, rivers, floods and air for Sri Lanka</div>
        <div class="lt-sp-bar"><i></i></div>
      </div>
    </div>
    <script>setTimeout(function () { var s = document.getElementById('lt-splash'); if (s) s.classList.add('lt-done') }, 10000)</script>
    <div id="root"><!--seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
