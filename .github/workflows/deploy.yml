name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Hourly rebuild: refreshes the public API under /api/v1/ and the gauge pages.
  # (Off the top of the hour, when GitHub's scheduler is busiest.)
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer run waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: API build summary
        run: node -e "const s=require('./dist/api/v1/status.json'); console.log(s.ok ? 'all feeds OK' : 'failed feeds: ' + s.feeds.filter(f=>!f.ok).map(f=>f.id+' ('+f.error+')').join(', ')); console.log('carried over:', s.carried_over.length)"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish, and only with these two permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
